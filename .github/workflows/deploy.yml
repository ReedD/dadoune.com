name: Deploy

on:
  push:
    branches: [master]
  # Lets you re-run a deploy from the Actions tab without pushing.
  workflow_dispatch:

# No long-lived AWS keys: the job trades this token for an IAM role.
permissions:
  id-token: write
  contents: read

# Never let two deploys sync the same bucket at once. Queue instead of
# cancelling, so an in-flight upload is not left half-applied.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.dadoune.com/

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gate the deploy on types and templates being sound.
      - name: Check
        run: npm run check

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::375003816393:role/dadoune-com-github-deploy
          aws-region: us-east-1

      # Builds, syncs with per-file cache headers, invalidates CloudFront.
      # Same script used for local deploys, so the two cannot drift.
      - name: Deploy
        run: ./scripts/deploy.sh

      # A smoke test, not a gate on the deploy itself, which has already
      # happened by this point. It retries and checks every path before
      # failing, so one transient TLS reset from the CDN cannot fail a deploy
      # that worked, and a real outage reports every affected URL at once.
      - name: Verify
        run: |
          fail=0
          for path in / /projects /blog /blog/docker-ambassador; do
            url="https://www.dadoune.com${path}"
            # `|| echo 000` matters: the step runs under `bash -e`, so without
            # it a non-zero curl exit aborts before the status is compared.
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L \
                     --retry 5 --retry-delay 2 --retry-all-errors \
                     --connect-timeout 10 --max-time 30 "$url" || echo 000)
            printf '%s %s\n' "$code" "$path"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
